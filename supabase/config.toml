# task-005: 인증 한도 설정만 둔 최소 설정. 나머지 항목은 Supabase CLI 기본값을 따른다.
# 로컬 CLI·Docker로는 아직 검증하지 못했다(supabase-verify.md 확인 필요).
project_id = "knowflow-ai"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/api/auth/callback"]
minimum_password_length = 10

# 앱 한도(로그인 분당 5회·재설정 시간당 3회)는 앱·Postgres에서 따로 강제한다. 아래는 Supabase Auth 자체의 안전망이다.
[auth.rate_limit]
email_sent = 10          # 시간당 인증 메일 수(프로젝트 전체)
token_refresh = 150      # 5분당 IP별 토큰 갱신
sign_in_sign_ups = 30    # 5분당 IP별 로그인·가입
token_verifications = 30 # 5분당 IP별 OTP·링크 검증
